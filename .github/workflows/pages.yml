# Builds the KAST Docs flight index from the kOS logs and publishes the site to GitHub Pages.
# Runs on every push from the PC (Publish_KAST_Site.ps1) and can be run by hand from the Actions tab.
name: Publish KAST Docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build flight logs and booster telemetry
        run: python KAST_Docs/tools/build_logs.py
      - name: Leave out PC-only files
        run: rm -f KAST_Docs/*.bat
      - uses: actions/upload-pages-artifact@v3
        with:
          path: KAST_Docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
